<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Office Tracker · ícono fuente (calendario 3D). Los PNG (icon-192, icon-512) se generan desde este archivo.
       El dibujo completo está dentro de la zona segura de los íconos adaptables (círculo de radio 205 en el centro). -->
  <defs>
    <!-- Fondo -->
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#40464f"/>
      <stop offset="0.5" stop-color="#282c33"/>
      <stop offset="1" stop-color="#15171c"/>
    </linearGradient>
    <radialGradient id="halo" cx="256" cy="250" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0213f" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#e0213f" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#e0213f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="luz" cx="110" cy="30" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cuadricula" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="sombraSuelo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Calendario -->
    <linearGradient id="hoja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe3ea"/>
    </linearGradient>
    <linearGradient id="canto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9bfc9"/>
      <stop offset="1" stop-color="#7d838e"/>
    </linearGradient>
    <linearGradient id="cabecera" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ff4a66"/>
      <stop offset="0.55" stop-color="#e0213f"/>
      <stop offset="1" stop-color="#b3112c"/>
    </linearGradient>
    <linearGradient id="brilloCabecera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c828c"/>
      <stop offset="0.35" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#d3d8df"/>
      <stop offset="1" stop-color="#6d737c"/>
    </linearGradient>
    <linearGradient id="celda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e7ed"/>
      <stop offset="1" stop-color="#f6f7f9"/>
    </linearGradient>
    <linearGradient id="celdaRoja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd2da"/>
      <stop offset="1" stop-color="#ffe7eb"/>
    </linearGradient>
    <!-- Insignia -->
    <radialGradient id="insignia" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ff5b75"/>
      <stop offset="0.5" stop-color="#e0213f"/>
      <stop offset="1" stop-color="#9e0e26"/>
    </radialGradient>
    <linearGradient id="brilloInsignia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="resplandor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3d5a" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ff3d5a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cara"><rect x="136" y="124" width="240" height="252" rx="34"/></clipPath>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="sombraSuave" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fondo grafito a sangre (los íconos adaptables recortan la forma) -->
  <rect width="512" height="512" fill="url(#fondo)"/>
  <rect width="512" height="512" fill="url(#cuadricula)"/>
  <rect width="512" height="512" fill="url(#luz)"/>
  <rect width="512" height="512" fill="url(#halo)"/>

  <!-- Sombra en el suelo -->
  <ellipse cx="256" cy="408" rx="140" ry="18" fill="url(#sombraSuelo)"/>

  <g filter="url(#sombra)">
    <!-- Grosor: hojas apiladas debajo -->
    <rect x="136" y="148" width="240" height="252" rx="34" fill="url(#canto)"/>
    <rect x="136" y="140" width="240" height="252" rx="34" fill="#c9ced6"/>
    <rect x="136" y="132" width="240" height="252" rx="34" fill="#e4e7ec"/>
    <!-- Cara -->
    <rect x="136" y="124" width="240" height="252" rx="34" fill="url(#hoja)"/>
  </g>

  <!-- Cabecera roja con brillo -->
  <g clip-path="url(#cara)">
    <rect x="136" y="124" width="240" height="76" fill="url(#cabecera)"/>
    <rect x="136" y="124" width="240" height="38" fill="url(#brilloCabecera)"/>
    <rect x="136" y="198" width="240" height="4" fill="#000000" fill-opacity="0.12"/>
  </g>
  <!-- Orificios de los anillos -->
  <ellipse cx="200" cy="168" rx="11" ry="7" fill="#5e0a19"/>
  <ellipse cx="312" cy="168" rx="11" ry="7" fill="#5e0a19"/>
  <!-- Anillos metálicos -->
  <g filter="url(#sombraSuave)">
    <rect x="192" y="96" width="16" height="74" rx="8" fill="url(#metal)"/>
    <rect x="304" y="96" width="16" height="74" rx="8" fill="url(#metal)"/>
  </g>

  <!-- Días -->
  <g fill="url(#celda)" stroke="#c7ccd5" stroke-width="1.5">
    <rect x="164" y="222" width="36" height="34" rx="9"/><rect x="214" y="222" width="36" height="34" rx="9"/><rect x="264" y="222" width="36" height="34" rx="9"/><rect x="314" y="222" width="36" height="34" rx="9"/>
    <rect x="164" y="268" width="36" height="34" rx="9"/><rect x="214" y="268" width="36" height="34" rx="9"/><rect x="264" y="268" width="36" height="34" rx="9"/><rect x="314" y="268" width="36" height="34" rx="9"/>
    <rect x="164" y="314" width="36" height="34" rx="9"/><rect x="214" y="314" width="36" height="34" rx="9"/>
  </g>
  <!-- Días ya marcados (oficina) -->
  <g fill="url(#celdaRoja)" stroke="#f3a3b0" stroke-width="1.5">
    <rect x="214" y="222" width="36" height="34" rx="9"/><rect x="314" y="222" width="36" height="34" rx="9"/><rect x="164" y="268" width="36" height="34" rx="9"/>
  </g>
  <g fill="#e0213f">
    <circle cx="232" cy="239" r="5"/><circle cx="332" cy="239" r="5"/><circle cx="182" cy="285" r="5"/>
  </g>
  <!-- Borde de luz de la hoja -->
  <rect x="137.5" y="125.5" width="237" height="249" rx="32.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Insignia 3D con ✓: «fui a la oficina» -->
  <circle cx="352" cy="352" r="76" fill="url(#resplandor)"/>
  <g filter="url(#sombra)">
    <circle cx="352" cy="356" r="50" fill="#7a0a1d"/>
    <circle cx="352" cy="350" r="50" fill="url(#insignia)"/>
  </g>
  <ellipse cx="352" cy="330" rx="34" ry="20" fill="url(#brilloInsignia)"/>
  <circle cx="352" cy="350" r="49" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M330 351 L346 367 L376 334" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
